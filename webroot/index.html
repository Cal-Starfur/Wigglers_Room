<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #e6edf3; font-family: sans-serif; width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #loading { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .worm { font-size: 48px; animation: wiggle 0.5s ease-in-out infinite alternate; }
    @keyframes wiggle { from { transform: rotate(-15deg); } to { transform: rotate(15deg); } }
    #game { display: none; width: 100%; height: 100vh; align-items: center; justify-content: center; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="loading">
    <img class="worm" src="./icon.png" width="80" height="80"/>
    <p>Warming up the wigglers...</p>
  </div>
  <canvas id="game-canvas" style="display:none;"></canvas>
  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    function startGame() {
      document.getElementById('loading').style.display = 'none';
      canvas.style.display = 'block';
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      ctx.fillStyle = '#0d1117';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#6BCB77';
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🐛 Wigglers Room Ready!', canvas.width/2, canvas.height/2);
    }

    function sendToServer(msg) { window.parent.postMessage(msg, '*'); }

    window.addEventListener('message', (e) => {
      const msg = e.data;
      if (!msg?.type) return;
      if (msg.type === 'STATE_SYNC') startGame();
    });

    sendToServer({ type: 'READY' });
    setTimeout(startGame, 2000);
  </script>
</body>
</html>
