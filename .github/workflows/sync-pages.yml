name: Sync webroot to docs (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'webroot/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync webroot to docs
        run: |
          mkdir -p docs
          cp webroot/game.js docs/game.js
          cp webroot/style.css docs/style.css
          cp webroot/index.html docs/index.html

      - name: Commit docs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Pages: auto-sync docs from webroot"
          git push
