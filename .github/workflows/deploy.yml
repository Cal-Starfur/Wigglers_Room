name: Build Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Devvit CLI
        run: npm install -g devvit

      - name: Build
        run: npm run build

      - name: Report
        if: always()
        run: |
          echo "Commit : ${{ github.sha }}"
          echo "Status : ${{ job.status }}"
